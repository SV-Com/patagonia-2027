<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Patagonia 2027</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ruta2027">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; }
    .tab-active { color: #60a5fa !important; border-top: 2px solid #60a5fa; background: rgba(96,165,250,0.05); }
    .tab-btn { transition: color 0.15s, background 0.15s; }
    .press:active { opacity: 0.65; transform: scale(0.94); }
    .fade { animation: fadeIn 0.22s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 0; background: transparent; }
    input[type="number"] { -webkit-appearance: none; -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button { opacity: 1; height: 28px; }
    .dashed-line { border-left: 2px dashed #374151; }
    .night-btn { transition: background 0.15s, transform 0.1s; }
    .night-btn:active { transform: scale(0.88); }
    .card { background: #1f2937; border-radius: 1rem; }
    .badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 999px; }
    .sheet { transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.32,0.72,0,1); }
    .sheet.open { transform: translateY(0); }
    .overlay { opacity: 0; transition: opacity 0.28s; pointer-events: none; }
    .overlay.open { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<!-- ─── HEADER ─────────────────────────────────────── -->
<header class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-blue-950 to-blue-900 shadow-2xl">
  <div class="max-w-lg mx-auto px-4 pt-4 pb-3">
    <div class="flex justify-between items-start">
      <div>
        <h1 class="text-lg font-bold leading-tight">🏔️ Al Fin del Mundo</h1>
        <p class="text-blue-300 text-xs mt-0.5">Patagonia · Enero 2027 · Nissan Versa</p>
      </div>
      <div id="day-counter" class="text-right"></div>
    </div>
    <div class="mt-2 bg-blue-950 rounded-full h-1.5 overflow-hidden">
      <div id="progress-bar" class="h-full rounded-full transition-all duration-500 bg-blue-400"></div>
    </div>
  </div>
</header>

<!-- ─── MAIN CONTENT ───────────────────────────────── -->
<main class="max-w-lg mx-auto pt-[88px] pb-[72px]">
  <div id="tab-itinerary" class="tab-pane fade"></div>
  <div id="tab-finanzas"  class="tab-pane fade hidden"></div>
  <div id="tab-combustible" class="tab-pane fade hidden"></div>
  <div id="tab-info"     class="tab-pane fade hidden"></div>
</main>

<!-- ─── BOTTOM TAB BAR ────────────────────────────── -->
<nav class="fixed bottom-0 left-0 right-0 z-50 bg-gray-800 border-t border-gray-700" style="padding-bottom: env(safe-area-inset-bottom, 0px)">
  <div class="max-w-lg mx-auto flex">
    <button class="tab-btn tab-active flex-1 flex flex-col items-center py-2.5 text-xs font-medium" data-tab="itinerary">
      <span class="text-xl leading-none mb-1">🗺️</span><span>Ruta</span>
    </button>
    <button class="tab-btn flex-1 flex flex-col items-center py-2.5 text-xs font-medium text-gray-400" data-tab="finanzas">
      <span class="text-xl leading-none mb-1">💰</span><span>Finanzas</span>
    </button>
    <button class="tab-btn flex-1 flex flex-col items-center py-2.5 text-xs font-medium text-gray-400" data-tab="combustible">
      <span class="text-xl leading-none mb-1">⛽</span><span>Nafta</span>
    </button>
    <button class="tab-btn flex-1 flex flex-col items-center py-2.5 text-xs font-medium text-gray-400" data-tab="info">
      <span class="text-xl leading-none mb-1">ℹ️</span><span>Info</span>
    </button>
  </div>
</nav>

<!-- ─── MODAL: NUEVA PARADA ────────────────────────── -->
<div id="modal-overlay" class="overlay fixed inset-0 bg-black bg-opacity-60 z-[60] flex items-end">
  <div id="modal-sheet" class="sheet bg-gray-800 w-full max-w-lg mx-auto rounded-t-2xl p-5 pb-10 shadow-2xl">
    <div class="w-10 h-1 bg-gray-600 rounded-full mx-auto mb-4"></div>
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-lg">➕ Nueva Parada</h3>
      <button onclick="closeStopModal()" class="press w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-gray-300 text-xl leading-none">×</button>
    </div>
    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Ciudad *</label>
          <input type="text" id="ns-name" placeholder="Ej: Bahía Blanca"
            class="w-full bg-gray-700 rounded-lg px-3 py-2.5 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Provincia</label>
          <input type="text" id="ns-province" placeholder="Ej: Buenos Aires"
            class="w-full bg-gray-700 rounded-lg px-3 py-2.5 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Tipo</label>
          <select id="ns-type" class="w-full bg-gray-700 rounded-lg px-2 py-2.5 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
            <option value="turistica">Turística</option>
            <option value="tecnica">Técnica</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Noches</label>
          <input type="number" id="ns-nights" value="1" min="0" max="14"
            class="w-full bg-gray-700 rounded-lg px-3 py-2.5 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Km desde ant.</label>
          <input type="number" id="ns-km" placeholder="0" min="0"
            class="w-full bg-gray-700 rounded-lg px-3 py-2.5 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Nota (opcional)</label>
        <input type="text" id="ns-note" placeholder="Descripción o recordatorio"
          class="w-full bg-gray-700 rounded-lg px-3 py-2.5 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
      </div>
      <div class="pt-1 text-xs text-gray-500">
        💡 Verificá también los km de la parada siguiente al agregar una nueva.
      </div>
      <button onclick="confirmAddStop()"
        class="press w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl transition-colors">
        Agregar Parada al Itinerario
      </button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// CONSTANTES DEL VIAJE
// ═══════════════════════════════════════════════════
const TRIP = {
  startDate:    new Date('2027-01-02T00:00:00'),
  maxDays:      21,
  deadline:     new Date('2027-01-23T00:00:00'),
  budget:       4200,   // USD total
  consumption:  6,      // litros / 100 km
  tankRange:    700,    // km por tanque
};

// ═══════════════════════════════════════════════════
// PARADAS POR DEFECTO
// ═══════════════════════════════════════════════════
const DEFAULT_STOPS = [

  },
  {

  },

    note: 'Costa patagónica. Fauna marina impresionante.',
    activities: ['Playa El Doradillo (ballenas en temporada)', 'Punta Loma (lobos marinos)', 'Centro histórico y muelle']
  },
  {

    lat: -45.8653, lng: -67.4978,

    activities: ['Carga de combustible (importante)', 'Museo del Petróleo (opcional)']
  },
  {

  },
  {
    id: 5, type: 'turistica',
    name: 'El Calafate', province: 'Santa Cruz',
    nights: 2, distance: 660,
    lat: -50.3396, lng: -72.2752,
    note: 'Capital de los glaciares. Reservar Perito Moreno con anticipación.',
    activities: ['Glaciar Perito Moreno (reservar entrada)', 'Lago Argentino', 'Mirador de los Cóndores']
  },
  {
    id: 6, type: 'tecnica',
    name: 'Perito Moreno', province: 'Santa Cruz',
    nights: 1, distance: 420,
    lat: -46.5394, lng: -70.9244,
    note: 'Localidad sobre Ruta 40 Norte. No confundir con el glaciar.',
    activities: ['Cueva de las Manos (120 km al sur, opcional)', 'Descanso pre-regreso']
  },
  {
    id: 7, type: 'destino',
    name: 'Regreso a Chajarí', province: 'Entre Ríos',
    nights: 0, distance: 1800,
    lat: -30.7500, lng: -57.9500,
    note: 'Ruta 40 → Ruta 22 → Paraná → Chajarí. Dividir en 3 tramos de ~600 km.',
    activities: ['Tramo 1: ~600 km (hasta Neuquén o Zapala)', 'Tramo 2: ~600 km (hasta San Rafael o Gral. Alvear)', 'Tramo 3: ~600 km (hasta Chajarí)']
  }
];

// ═══════════════════════════════════════════════════
// ESTADO (persiste en localStorage)
// ═══════════════════════════════════════════════════
let state = { stops: [], expenses: [], fuelPrice: 1.10 };
let currentTab = 'itinerary';

function loadState() {
  try {
    const raw = localStorage.getItem('pat2027');
    if (raw) {
      const s = JSON.parse(raw);
      state.stops     = s.stops     || deepClone(DEFAULT_STOPS);
      state.expenses  = s.expenses  || [];
      state.fuelPrice = s.fuelPrice || 1.10;
    } else {
      state.stops = deepClone(DEFAULT_STOPS);
    }
  } catch { state.stops = deepClone(DEFAULT_STOPS); }
}

function saveState() {
  localStorage.setItem('pat2027', JSON.stringify(state));
}

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

// ═══════════════════════════════════════════════════
// UTILIDADES DE FECHA
// ═══════════════════════════════════════════════════
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function fmtDate(d) {
  return d.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtShort(d) {
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

// ═══════════════════════════════════════════════════
// CÁLCULO DE FECHAS DEL ITINERARIO
// ═══════════════════════════════════════════════════
function calcDates() {
  const stops = state.stops;

  // Origen: salida el día de inicio
  stops[0].arrival   = new Date(TRIP.startDate);
  stops[0].departure = new Date(TRIP.startDate);

  // Cada parada: llega al día siguiente de la salida anterior
  for (let i = 1; i < stops.length; i++) {
    stops[i].arrival   = addDays(stops[i - 1].departure, 1);
    stops[i].departure = addDays(stops[i].arrival, stops[i].nights);
  }

  // Regreso a casa: desde salida de anteúltima parada + días de manejo
  const lastStop   = stops[stops.length - 1];
  const returnDays = Math.ceil(lastStop.distance / TRIP.tankRange);
  const returnHome = addDays(stops[stops.length - 2].departure, returnDays);

  const totalDays = daysBetween(TRIP.startDate, returnHome);
  return { totalDays, returnHome };
}

// ═══════════════════════════════════════════════════
// TOTALES
// ═══════════════════════════════════════════════════
function totalNights() { return state.stops.reduce((s, p) => s + p.nights, 0); }
function totalKm()     { return state.stops.reduce((s, p) => s + p.distance, 0); }
function totalSpent()  { return state.expenses.reduce((s, e) => s + (e.hotel || 0) + (e.food || 0) + (e.other || 0), 0); }
function budgetLeft()  { return TRIP.budget - totalSpent(); }

// ═══════════════════════════════════════════════════
// LINKS DE GOOGLE MAPS (Android Auto)
// ═══════════════════════════════════════════════════
function mapsLink(from, to) {
  const origin = (from.lat && from.lng)
    ? `${from.lat},${from.lng}`
    : encodeURIComponent(`${from.name}${from.province ? ', ' + from.province : ''}, Argentina`);
  const dest = (to.lat && to.lng)
    ? `${to.lat},${to.lng}`
    : encodeURIComponent(`${to.name}${to.province ? ', ' + to.province : ''}, Argentina`);
  return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`;
}

// ═══════════════════════════════════════════════════
// RENDER: HEADER
// ═══════════════════════════════════════════════════
function renderHeader() {
  const { totalDays } = calcDates();
  const over  = totalDays > TRIP.maxDays;
  const pct   = Math.min(100, Math.round((totalDays / TRIP.maxDays) * 100));

  document.getElementById('day-counter').innerHTML = `
    <div class="flex flex-col items-end">
      <div class="text-2xl font-black leading-none ${over ? 'text-red-400' : 'text-green-400'}">${totalDays}
        <span class="text-sm font-normal text-blue-300">/${TRIP.maxDays}d</span>
      </div>
      <div class="text-xs mt-0.5 ${over ? 'text-red-400' : 'text-blue-300'}">${over ? '⚠ excede' : '✓ en plazo'}</div>
    </div>`;

  const bar = document.getElementById('progress-bar');
  bar.style.width = pct + '%';
  bar.className = `h-full rounded-full transition-all duration-500 ${over ? 'bg-red-500' : pct > 80 ? 'bg-yellow-400' : 'bg-blue-400'}`;
}

// ═══════════════════════════════════════════════════
// RENDER: ITINERARIO
// ═══════════════════════════════════════════════════
function renderItinerary() {
  const { totalDays, returnHome } = calcDates();
  const over   = totalDays > TRIP.maxDays;
  const stops  = state.stops;
  const nights = totalNights();
  const km     = totalKm();

  const typeColor = {
    origen:   'bg-emerald-900 text-emerald-300',
    tecnica:  'bg-gray-700 text-gray-300',
    turistica:'bg-blue-900 text-blue-300',
    destino:  'bg-purple-900 text-purple-300',
  };
  const typeLabel = {
    origen: 'ORIGEN', tecnica: 'TÉCNICA', turistica: 'TURÍSTICA', destino: 'REGRESO'
  };

  let html = '';

  // Alerta de días
  if (over) {
    const excess = totalDays - TRIP.maxDays;
    html += `<div class="mx-3 mt-3 bg-red-950 border border-red-700 rounded-xl p-3 flex gap-3">
      <span class="text-2xl">⚠️</span>
      <div><div class="font-bold text-red-300">Viaje excede el límite en ${excess} día${excess > 1 ? 's' : ''}</div>
      <div class="text-xs text-red-400 mt-0.5">Reducí noches en alguna parada para llegar antes del 23 de enero.</div></div>
    </div>`;
  }

  // Resumen rápido
  html += `<div class="mx-3 mt-3 card p-4 grid grid-cols-4 gap-2 text-center">
    <div><div class="text-lg font-black text-blue-400">${nights}</div><div class="text-gray-500 text-xs">noches</div></div>
    <div><div class="text-lg font-black text-violet-400">${(km/1000).toFixed(1)}k</div><div class="text-gray-500 text-xs">km</div></div>
    <div><div class="text-lg font-black ${over ? 'text-red-400' : 'text-green-400'}">${totalDays}</div><div class="text-gray-500 text-xs">días</div></div>
    <div><div class="text-lg font-black text-amber-400">$${budgetLeft().toFixed(0)}</div><div class="text-gray-500 text-xs">restante</div></div>
  </div>`;

  // Paradas
  stops.forEach((stop, idx) => {
    const prev   = idx > 0 ? stops[idx - 1] : null;
    const isOrig = stop.type === 'origen';
    const isDest = stop.type === 'destino';
    const canEdit = !isOrig && !isDest;

    // Conector entre paradas + botón insertar
    if (idx > 0) {
      const horas  = Math.round(stop.distance / 80);
      const litros = (stop.distance * TRIP.consumption / 100).toFixed(0);
      const alertL = stop.distance > 700 ? '<span class="ml-1 text-yellow-400">⚡ tramo largo</span>' : '';
      html += `<div class="flex ml-6 my-0.5">
        <div class="dashed-line ml-3 pl-4 py-2 flex-1">
          <div class="text-xs text-gray-500">🚗 ${stop.distance} km &nbsp;·&nbsp; ~${horas}h &nbsp;·&nbsp; ${litros} L${alertL}</div>
          <div class="flex flex-wrap gap-3 mt-1">
            ${!isDest && prev ? `<a href="${mapsLink(prev, stop)}" target="_blank"
              class="press inline-flex items-center gap-1 text-xs text-blue-500 font-semibold">
              📍 Navegar →</a>` : ''}
            <button onclick="openStopModal(${idx - 1})"
              class="press inline-flex items-center gap-1 text-xs text-emerald-500 font-semibold">
              ＋ Insertar parada aquí</button>
          </div>
        </div>
      </div>`;
    }

    // Card de parada
    html += `<div class="mx-3 my-1.5 card overflow-hidden shadow-lg">
      <div class="p-4 pb-3">
        <div class="flex justify-between items-start gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-1.5 mb-1">
              <span class="badge ${typeColor[stop.type]}">${typeLabel[stop.type]}</span>
              <span class="text-xs text-gray-500">${stop.province}</span>
              ${stop.custom ? `<button onclick="deleteStop(${stop.id})"
                class="press badge bg-red-950 text-red-400 border border-red-800">✕ eliminar</button>` : ''}
            </div>
            <h2 class="text-xl font-black truncate">${stop.name}</h2>
          </div>
          <div class="text-right shrink-0">
            <div class="text-sm font-semibold text-gray-200">${fmtDate(stop.arrival)}</div>
            ${stop.nights > 0 ? `<div class="text-xs text-gray-500">sale ${fmtShort(stop.departure)}</div>` : ''}
          </div>
        </div>
        ${stop.note ? `<p class="text-xs text-gray-400 mt-2 leading-relaxed">${stop.note}</p>` : ''}

        <!-- Actividades editables -->
        <div class="mt-2 space-y-0.5">
          ${(stop.activities || []).map((a, ai) => `
            <div class="flex items-center gap-1">
              <span class="text-xs text-gray-500 flex-1">· ${a}</span>
              <button onclick="removeActivity(${stop.id}, ${ai})"
                class="press shrink-0 text-red-500 text-base w-5 h-5 flex items-center justify-center opacity-50 hover:opacity-100">×</button>
            </div>`).join('')}
        </div>
        <div class="flex gap-1.5 mt-2">
          <input type="text" id="act-${stop.id}" placeholder="＋ agregar actividad o visita"
            class="flex-1 bg-gray-700 rounded-lg px-2.5 py-1.5 text-xs border border-gray-600 focus:border-blue-500 focus:outline-none"
            onkeydown="if(event.key==='Enter')addActivity(${stop.id})">
          <button onclick="addActivity(${stop.id})"
            class="press bg-gray-700 hover:bg-gray-600 text-blue-400 font-bold px-3 rounded-lg text-sm transition-colors">＋</button>
        </div>
      </div>

      ${canEdit ? `<div class="border-t border-gray-700 px-4 py-2.5 flex items-center justify-between bg-gray-900 bg-opacity-30">
        <span class="text-sm text-gray-300">Noches</span>
        <div class="flex items-center gap-3">
          <button onclick="changeNights(${stop.id}, -1)"
            class="night-btn w-9 h-9 rounded-full bg-gray-700 flex items-center justify-center text-xl font-bold press">−</button>
          <span class="text-2xl font-black text-blue-400 w-6 text-center">${stop.nights}</span>
          <button onclick="changeNights(${stop.id}, 1)"
            class="night-btn w-9 h-9 rounded-full bg-blue-700 flex items-center justify-center text-xl font-bold press">+</button>
        </div>
      </div>` : ''}
    </div>`;
  });

  // Fecha de regreso estimada
  const onTime = returnHome <= TRIP.deadline;
  html += `<div class="mx-3 my-4 text-center">
    <div class="text-xs text-gray-500 mb-0.5">Regreso estimado a Chajarí</div>
    <div class="text-lg font-bold ${onTime ? 'text-green-400' : 'text-red-400'}">${fmtDate(returnHome)}</div>

    </div>
  </div>`;

  document.getElementById('tab-itinerary').innerHTML = html;
}

// ═══════════════════════════════════════════════════
// RENDER: FINANZAS
// ═══════════════════════════════════════════════════
function renderFinanzas() {
  const spent    = totalSpent();
  const left     = budgetLeft();
  const pct      = Math.min(100, (spent / TRIP.budget * 100));
  const barColor = pct > 90 ? 'bg-red-500' : pct > 70 ? 'bg-yellow-500' : 'bg-green-500';
  const days     = state.expenses.length;
  const avgDay   = days > 0 ? (spent / days).toFixed(0) : 0;

  let html = `
  <!-- Resumen presupuesto -->
  <div class="mx-3 mt-3 card p-4">
    <div class="flex justify-between items-baseline mb-3">
      <h2 class="font-bold">Presupuesto Total</h2>
      <span class="text-gray-400 text-sm">$${TRIP.budget.toLocaleString()} USD</span>
    </div>
    <div class="bg-gray-700 rounded-full h-2.5 mb-3 overflow-hidden">
      <div class="${barColor} h-full rounded-full transition-all" style="width:${pct.toFixed(1)}%"></div>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-gray-900 rounded-xl p-2.5">
        <div class="text-lg font-black text-red-400">$${spent.toFixed(0)}</div>
        <div class="text-gray-500 text-xs">gastado</div>
      </div>
      <div class="bg-gray-900 rounded-xl p-2.5">
        <div class="text-lg font-black ${left < 0 ? 'text-red-400' : 'text-green-400'}">$${left.toFixed(0)}</div>
        <div class="text-gray-500 text-xs">disponible</div>
      </div>
      <div class="bg-gray-900 rounded-xl p-2.5">
        <div class="text-lg font-black text-blue-400">$${avgDay}</div>
        <div class="text-gray-500 text-xs">prom/día</div>
      </div>
    </div>
    <div class="mt-2 text-xs text-gray-500 text-center">
      $200 USD/día &nbsp;·&nbsp; ${totalNights()} noches planificadas
      &nbsp;·&nbsp; Días registrados: ${days}
    </div>
  </div>

  <!-- Formulario de carga -->
  <div class="mx-3 mt-3 card p-4">
    <h3 class="font-bold mb-3">➕ Registrar Gasto del Día</h3>
    <div class="space-y-2.5">
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="text-xs text-gray-400 mb-1 block">Fecha</label>
          <input type="date" id="exp-date" value="2027-01-02"
            class="w-full bg-gray-700 rounded-lg px-3 py-2 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
        <div class="flex-1">
          <label class="text-xs text-gray-400 mb-1 block">Lugar</label>
          <input type="text" id="exp-place" placeholder="Ej: Puerto Madryn" list="lugares"
            class="w-full bg-gray-700 rounded-lg px-3 py-2 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
      </div>
      <datalist id="lugares">${state.stops.map(s => `<option value="${s.name}">`).join('')}</datalist>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">🏨 Hotel</label>
          <input type="number" id="exp-hotel" placeholder="0" min="0"
            class="w-full bg-gray-700 rounded-lg px-3 py-2 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">🍽️ Comida</label>
          <input type="number" id="exp-food" placeholder="0" min="0"
            class="w-full bg-gray-700 rounded-lg px-3 py-2 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">📦 Otro</label>
          <input type="number" id="exp-other" placeholder="0" min="0"
            class="w-full bg-gray-700 rounded-lg px-3 py-2 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>

      <input type="text" id="exp-note" placeholder="Nota opcional"
        class="w-full bg-gray-700 rounded-lg px-3 py-2 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none">
      <button onclick="addExpense()"
        class="press w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-xl transition-colors">
        Guardar Gasto

  </div>

  <!-- Lista de gastos -->

    html += `<div class="text-center text-gray-600 py-10 text-sm">Sin gastos registrados todavía.<br>¡El viaje aún no comenzó!</div>`;

  html += `</div><div class="h-2"></div>`;
  document.getElementById('tab-finanzas').innerHTML = html;
}

// ═══════════════════════════════════════════════════
// RENDER: COMBUSTIBLE
// ═══════════════════════════════════════════════════
function renderCombustible() {
  const km     = totalKm();
  const litros = km * TRIP.consumption / 100;
  const precio = state.fuelPrice;
  const costo  = litros * precio;
  const tanques = Math.ceil(km / TRIP.tankRange);

  let html = `
  <div class="mx-3 mt-3 card p-4">
    <h2 class="font-bold text-lg mb-4">⛽ Calculadora de Combustible</h2>

    <div class="mb-4">
      <label class="text-xs text-gray-400 mb-1.5 block">Precio estimado del litro (USD)</label>
      <div class="flex gap-2 items-center">
        <input type="number" id="fuel-price" value="${precio}" step="0.05" min="0.3"
          class="flex-1 bg-gray-700 rounded-lg px-3 py-2.5 text-sm border border-gray-600 focus:border-blue-500 focus:outline-none"
          oninput="updateFuelPrice(this.value)">
        <span class="text-gray-400 text-sm shrink-0">USD / litro</span>
      </div>
      <div class="text-xs text-gray-500 mt-1">Referencia: nafta súper en Argentina ≈ $0.80–1.30 USD/L según cotización dólar.</div>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-gray-900 rounded-xl p-3 text-center">
        <div class="text-2xl font-black text-blue-400">${km.toLocaleString()}</div>
        <div class="text-xs text-gray-500">km totales</div>
      </div>
      <div class="bg-gray-900 rounded-xl p-3 text-center">
        <div class="text-2xl font-black text-violet-400">${litros.toFixed(0)}</div>
        <div class="text-xs text-gray-500">litros estimados</div>
      </div>
      <div class="bg-gray-900 rounded-xl p-3 text-center">
        <div class="text-2xl font-black text-amber-400">${tanques}</div>
        <div class="text-xs text-gray-500">cargas de tanque</div>
      </div>
      <div class="bg-gray-900 rounded-xl p-3 text-center">
        <div class="text-2xl font-black text-green-400">$${costo.toFixed(0)}</div>
        <div class="text-xs text-gray-500">costo total USD</div>
      </div>
    </div>
    <div class="mt-3 text-xs text-gray-500 text-center">
      Consumo: ${TRIP.consumption} L/100km &nbsp;·&nbsp; Autonomía: ~${TRIP.tankRange} km/tanque
    </div>
  </div>

  <!-- Detalle por tramo -->
  <div class="mx-3 mt-3">
    <h3 class="font-bold mb-2 text-gray-300">Detalle por Tramo</h3>`;

  state.stops.forEach((stop, idx) => {
    if (stop.distance === 0) return;
    const prev   = state.stops[idx - 1];
    const litT   = (stop.distance * TRIP.consumption / 100).toFixed(0);
    const costoT = (litT * precio).toFixed(0);
    const horas  = Math.round(stop.distance / 80);
    const largo  = stop.distance > 700;

    html += `<div class="card p-3 mb-2">
      <div class="flex justify-between items-start">
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm truncate">${prev.name} → ${stop.name}</div>
          <div class="text-xs text-gray-500 mt-0.5">${stop.distance} km &nbsp;·&nbsp; ~${horas}h de ruta &nbsp;·&nbsp; ${litT} L</div>
          <div class="text-xs text-gray-600">Costo combustible: $${costoT} USD</div>
        </div>
        <div class="flex flex-col items-end gap-1 ml-2 shrink-0">
          ${largo ? `<span class="badge bg-yellow-900 text-yellow-300">⚡ 2 días</span>` : ''}
        </div>
      </div>
      ${stop.type !== 'destino' ? `<a href="${mapsLink(prev, stop)}" target="_blank"
        class="press mt-2 inline-flex items-center gap-1 text-xs text-blue-500 font-semibold">
        📍 Navegar este tramo →</a>` : ''}
    </div>`;
  });

  html += `</div><div class="h-2"></div>`;
  document.getElementById('tab-combustible').innerHTML = html;
}

// ═══════════════════════════════════════════════════
// ACCIONES
// ═══════════════════════════════════════════════════
function changeNights(id, delta) {
  const stop = state.stops.find(s => s.id === id);
  if (!stop) return;
  stop.nights = Math.max(0, stop.nights + delta);
  saveState();
  render();
}

function addExpense() {
  const date  = document.getElementById('exp-date').value;
  const place = document.getElementById('exp-place').value.trim();
  const hotel = parseFloat(document.getElementById('exp-hotel').value) || 0;
  const food  = parseFloat(document.getElementById('exp-food').value)  || 0;
  const other = parseFloat(document.getElementById('exp-other').value) || 0;
  const note  = document.getElementById('exp-note').value.trim();

  if (!date || hotel + food + other === 0) {
    alert('Ingresá la fecha y al menos un monto.');
    return;
  }

  state.expenses.push({ id: Date.now().toString(), date, place, hotel, food, other, note });
  saveState();
  renderFinanzas();

  // Limpiar campos de montos y nota, conservar fecha y lugar
  ['exp-hotel', 'exp-food', 'exp-other', 'exp-note'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

function deleteExpense(id) {
  state.expenses = state.expenses.filter(e => e.id !== id);
  saveState();
  renderFinanzas();
}

function updateFuelPrice(val) {
  state.fuelPrice = parseFloat(val) || 1.10;
  saveState();
  renderCombustible();
}

function resetApp() {
  if (!confirm('¿Restaurar todo a los valores originales? Se perderán los gastos registrados.')) return;
  state.stops     = deepClone(DEFAULT_STOPS);
  state.expenses  = [];
  state.fuelPrice = 1.10;
  saveState();
  render();
}

// ═══════════════════════════════════════════════════
// NAVEGACIÓN DE TABS
// ═══════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;

  document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
  const pane = document.getElementById('tab-' + tab);
  pane.classList.remove('hidden');
  // Re-trigger animation
  pane.classList.remove('fade');
  void pane.offsetWidth;
  pane.classList.add('fade');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('tab-active');
    btn.classList.add('text-gray-400');
  });
  const activeBtn = document.querySelector(`[data-tab="${tab}"]`);
  activeBtn.classList.add('tab-active');
  activeBtn.classList.remove('text-gray-400');

  renderHeader();
  if (tab === 'finanzas')    renderFinanzas();
  else if (tab === 'combustible') renderCombustible();
  else if (tab === 'info')   renderInfo();
}

// ═══════════════════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════════════════
function render() {
  calcDates();
  renderHeader();
  renderItinerary();
  if (currentTab === 'finanzas')     renderFinanzas();
  if (currentTab === 'combustible')  renderCombustible();
  if (currentTab === 'info')         renderInfo();
}

// ═══════════════════════════════════════════════════
// MODAL: NUEVA PARADA
// ═══════════════════════════════════════════════════
let _insertAfter = -1;

function openStopModal(afterIdx) {
  _insertAfter = afterIdx;
  ['ns-name','ns-province','ns-note','ns-km'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ns-nights').value = '1';
  document.getElementById('ns-type').value = 'turistica';
  const ov = document.getElementById('modal-overlay');
  const sh = document.getElementById('modal-sheet');
  ov.classList.add('open');
  sh.classList.add('open');
  setTimeout(() => document.getElementById('ns-name').focus(), 300);
}

function closeStopModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-sheet').classList.remove('open');
}

function confirmAddStop() {
  const name = document.getElementById('ns-name').value.trim();
  if (!name) { alert('Ingresá el nombre de la ciudad.'); return; }

  const newStop = {
    id: Date.now(),
    type:     document.getElementById('ns-type').value,
    name,
    province: document.getElementById('ns-province').value.trim(),
    nights:   parseInt(document.getElementById('ns-nights').value) || 0,
    distance: parseInt(document.getElementById('ns-km').value) || 0,
    lat: 0, lng: 0,
    note:     document.getElementById('ns-note').value.trim(),
    activities: [],
    custom: true,
  };

  state.stops.splice(_insertAfter + 1, 0, newStop);
  saveState();
  closeStopModal();
  render();
}

// ═══════════════════════════════════════════════════
// ELIMINAR PARADA CUSTOM
// ═══════════════════════════════════════════════════
function deleteStop(id) {
  if (!confirm('¿Eliminar esta parada del itinerario?')) return;
  state.stops = state.stops.filter(s => s.id !== id);
  saveState();
  render();
}

// ═══════════════════════════════════════════════════
// GESTIÓN DE ACTIVIDADES
// ═══════════════════════════════════════════════════
function addActivity(stopId) {
  const input = document.getElementById(`act-${stopId}`);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const stop = state.stops.find(s => s.id === stopId);
  if (!stop) return;
  if (!stop.activities) stop.activities = [];
  stop.activities.push(text);
  input.value = '';
  saveState();
  renderItinerary();
  // Restaurar foco después del re-render
  const restored = document.getElementById(`act-${stopId}`);
  if (restored) restored.focus();
}

function removeActivity(stopId, actIdx) {
  const stop = state.stops.find(s => s.id === stopId);
  if (!stop) return;
  stop.activities.splice(actIdx, 1);
  saveState();
  renderItinerary();
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  loadState();

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeStopModal();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  render();
});
</script>
